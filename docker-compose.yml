services:
  backend:
    build:
      context: ./server
    container_name: sih26190_backend
    restart: unless-stopped
    env_file:
      - path: ./server/.env
        required: false
    environment:
      PORT: 5000
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://sih_admin:sih_secure_password_2026@postgres:5432/sih26190_evidence_db
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadminpassword
      AWS_S3_BUCKET_NAME: sih26190-evidence
      JWT_SECRET: sih_local_docker_secret_change_me
      MAX_FILE_SIZE_BYTES: 524288000
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./client
      args:
        VITE_API_TARGET: http://backend:5000
    container_name: sih26190_frontend
    restart: unless-stopped
    environment:
      VITE_API_TARGET: http://backend:5000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

  # PostgreSQL Database Service
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sih26190_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sih_admin
      POSTGRES_PASSWORD: sih_secure_password_2026
      POSTGRES_DB: sih26190_evidence_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih_admin -d sih26190_evidence_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO S3-Compatible Object Storage Service
  minio:
    image: minio/minio:latest
    container_name: sih26190_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000" # MinIO S3 API
      - "9001:9001" # MinIO Web Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO Bucket Auto-Creation Service
  create-bucket:
    image: minio/mc:latest
    container_name: sih26190_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb --ignore-existing myminio/sih26190-evidence;
      /usr/bin/mc anonymous set none myminio/sih26190-evidence;
      echo 'Bucket sih26190-evidence initialized successfully';
      exit 0;
      "

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
